name: Probe

# One-off check: how do the job boards answer a plain request from a GitHub runner?
# One request per board, with the same honest user agent the pipeline uses.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: One request per Workday board
        run: |
          UA="job-watcher/1.0 (class project; reads public job boards once a day)"
          BODY='{"appliedFacets":{},"limit":20,"offset":0,"searchText":""}'
          for h in "capitalone.wd12 capitalone Capital_One" "wf.wd1 wf WellsFargoJobs" "mastercard.wd1 mastercard CorporateCareers" "blackrock.wd1 blackrock BlackRock_Professional" "paypal.wd1 paypal jobs" "visa.wd5 visa Visa"; do
            set -- $h
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" -X POST -H "Content-Type: application/json" -d "$BODY" "https://$1.myworkdayjobs.com/wday/cxs/$2/$3/jobs")
            echo "workday $2 -> $code"
          done
      - name: One request per other board
        run: |
          UA="job-watcher/1.0 (class project; reads public job boards once a day)"
          for u in "https://boards-api.greenhouse.io/v1/boards/stripe/jobs" "https://api.lever.co/v0/postings/spotify?mode=json" "https://api.ashbyhq.com/posting-api/job-board/ramp" "https://api.smartrecruiters.com/v1/companies/Experian/postings?limit=1"; do
            echo "$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" "$u") $u"
          done
